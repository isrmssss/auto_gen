# SoT порогов и настроек цикла. Определения метрик — в knowledge/METRICS.md.
# Агент не дублирует числа в AGENTS.md — только ссылается сюда.

project_name: ""

# Идентификаторы выборок / сплитов целевого проекта (даты, fold, dataset tag…)
primary_split: ""
holdout_splits: []
validation_min_labeled: 50

# Параллельные гипотезы за цикл / параллелизм внутри прогона (смысл задаёт проект)
workers: 3

# Сколько полных циклов (future→test→past→new future) за одну сессию агента
max_cycles: 10

# Имена метрик и вспомогательные ключи — заполнить под проект.
# Пример структуры (значения — заглушки):
# metrics:
#   primary: ["error_rate", "recall"]
#   higher_is_better: ["recall"]
#   lower_is_better: ["error_rate"]
#   slice_dims: ["category", "step"]
metrics: {}

# Правила статуса ✅/⚠️/❌. Конкретные пороги — здесь; логика сравнения — в METRICS.md.
# Пример:
# acceptance:
#   require_holdout_for_promote: true
#   no_regression_vs_champion: true
#   constraints: []
acceptance:
  require_holdout_for_promote: true

# Опорные точки сравнения
baselines:
  control: null
  champion: null
  champion_run: null
  champion_arm: null

# Линии / механики, которые нельзя повторять (заполняет проект по past/)
banned_lines: []

# Напоминания и проверки перед циклом (без чужих сервисов по умолчанию)
preflight:
  reminders: []
