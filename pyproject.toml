[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openrd"
version = "0.1.0"
description = "Local-first open-source R&D agent: research, hypothesize, experiment, remember."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{ name = "OpenRD contributors" }]
keywords = ["agents", "research", "ml", "orchestration", "sandbox"]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "openai>=1.50",
  "psutil>=6.0",
  "numpy>=2.0",
  "python-multipart>=0.0.12",
  "websockets>=13.0",
  "orjson>=3.10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
  "httpx>=0.27",
]
docker = ["docker>=7.1"]
embed = ["sentence-transformers>=3.1"]
docs = []
all = [
  "openrd[dev,docker,embed]",
]

[project.scripts]
openrd = "openrd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openrd = ["**/*.yaml", "**/*.sql"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
