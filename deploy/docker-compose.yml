services:
  searxng:
    image: docker.io/searxng/searxng:latest
    restart: unless-stopped
    ports:
      - "8888:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888/
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID

  openrd:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      OPENRD_HOME: /data
      OPENRD_WORKSPACES: /workspaces
      OPENRD_SEARXNG_URL: http://searxng:8080
      OPENRD_HOST: 0.0.0.0
      OPENRD_PORT: "8080"
    volumes:
      - openrd-data:/data
      - openrd-ws:/workspaces
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - searxng

volumes:
  openrd-data:
  openrd-ws:
